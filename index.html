<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pero Launcher</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-left">
      <img src="assets/icons/logo.png" class="app-icon" alt="">
      <span class="app-title">Pero V1.0.0</span>
    </div>
    <div class="titlebar-buttons">
      <button id="btn-min" class="win-btn">
          <svg width="10" height="10"><line x1="0" y1="5" x2="10" y2="5" stroke="black" stroke-width="1"/></svg>
      </button>
      <button id="btn-max" class="win-btn"></button>
      <button id="btn-close" class="win-btn close-btn">
          <svg width="10" height="10"><line x1="0" y1="0" x2="10" y2="10" stroke="black" stroke-width="1"/><line x1="10" y1="0" x2="0" y2="10" stroke="black" stroke-width="1"/></svg>
      </button>
    </div>
  </div>

  <div class="grid">
    <div class="tile yellow" id="tile-folder"><img src="assets/icons/folder.png" alt=""></div>
    <div class="tile red" id="tile-mods"><img src="assets/icons/mods.svg" alt=""></div>
    <div class="tile green" id="tile-play">
      <img src="assets/icons/play.png" alt="">

      <!-- Takes the play tile's place while a launch is under way. The whole
           panel is the cancel button, the same size and in the same spot as
           the tile it replaces - aiming at a small button inside a large red
           area meant a press could land on nothing at all. -->
      <button class="launch-panel hidden" id="launch-panel">
        <span class="launch-cross" id="launch-cross">
          <svg viewBox="0 0 48 48" width="56" height="56" aria-hidden="true">
            <line x1="12" y1="12" x2="36" y2="36" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
            <line x1="36" y1="12" x2="12" y2="36" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="launch-foot">
          <span class="launch-text" id="launch-text"></span>
          <span class="launch-bar"><span class="launch-fill" id="launch-fill"></span></span>
        </span>
      </button>
    </div>
    <div class="tile grey" id="tile-settings"><img src="assets/icons/settings.png" alt=""></div>
    <div class="tile white" id="tile-skin"><img src="assets/icons/skin.png" alt=""></div>
  </div>

  <div class="bluescreen hidden" id="bluescreen">
    <div class="bluescreen-inner">
      <div class="bluescreen-face">:(</div>
      <h1 id="bluescreen-what"></h1>
      <p id="bluescreen-why"></p>
      <p class="bluescreen-technical" id="bluescreen-technical"></p>
      <div class="bluescreen-buttons">
        <button id="bluescreen-action" class="hidden"></button>
        <button id="bluescreen-continue"></button>
      </div>
    </div>
  </div>

  <script src="src/i18n.js"></script>
  <script src="src/renderer.js"></script>
</body>
</html>
