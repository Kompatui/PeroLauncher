<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title data-i18n="settings.pageTitle">Pero Launcher</title>
  <link rel="stylesheet" href="src/style.css">
  <link rel="stylesheet" href="src/settings.css">
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-left">
      <button id="btn-back" class="back-btn">←</button>
      <img src="assets/icons/logo.png" class="app-icon" alt="">
      <span class="app-title">Pero V1.0.0</span>
    </div>
    <div class="titlebar-buttons">
      <button id="btn-min" class="win-btn">
          <svg width="10" height="10"><line x1="0" y1="5" x2="10" y2="5" stroke="black" stroke-width="1"/></svg>
      </button>
      <button id="btn-max" class="win-btn"></button>
      <button id="btn-close" class="win-btn close-btn">
          <svg width="10" height="10"><line x1="0" y1="0" x2="10" y2="10" stroke="black" stroke-width="1"/><line x1="10" y1="0" x2="0" y2="10" stroke="black" stroke-width="1"/></svg>
      </button>
    </div>
  </div>

  <div class="settings-page">
    <div class="settings-row compact" id="row-version">
      <span class="settings-label" data-i18n="settings.version">Version</span>
      <span class="settings-value" id="current-version">—</span>
      <button class="loader-badge hidden" id="edit-loader">
        <span class="loader-badge-name" id="current-loader"></span>
        <svg class="pencil" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M11.6 1.6a1.4 1.4 0 0 1 2 0l0.8 0.8a1.4 1.4 0 0 1 0 2l-7.3 7.3-3.1 0.8 0.8-3.1 7.3-7.3z"
                fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
          <path d="M10.4 2.8l2.8 2.8" fill="none" stroke="currentColor" stroke-width="1.3"/>
        </svg>
      </button>
    </div>

    <div class="settings-row compact" id="row-account">
      <span class="settings-label" data-i18n="settings.account">Account</span>
      <span class="settings-value" id="current-account">—</span>
    </div>

    <div class="settings-row compact full ram-row">
      <span class="settings-label" data-i18n="settings.memory">Memory (RAM)</span>
      <div class="ram-controls">
        <input type="range" id="ram-slider" min="1024" step="512">
        <input type="number" id="ram-number" step="512">
        <span data-i18n="settings.mib">MiB</span>
        <label class="auto-label">
          <input type="checkbox" id="ram-auto"> <span data-i18n="settings.auto">Auto</span>
        </label>
      </div>
    </div>

    <div class="settings-list">
      <div class="settings-item value" id="item-versions">
        <span class="settings-label" data-i18n="settings.showVersions">Show versions</span>
        <span class="settings-value" data-i18n="settings.configure">Configure</span>
      </div>

      <div class="settings-item value" id="item-java">
        <span class="settings-label" data-i18n="settings.java">Java / JRE</span>
        <span class="settings-value" id="current-java">—</span>
      </div>

      <div class="settings-item windowsize-item">
        <span class="settings-label" data-i18n="settings.windowSize">Window size</span>
        <div class="windowsize-controls">
          <input type="number" id="win-w" style="width:70px">
          <span>x</span>
          <input type="number" id="win-h" style="width:70px">
          <label class="auto-label">
            <input type="checkbox" id="win-fullscreen"> <span data-i18n="settings.fullscreen">Fullscreen</span>
          </label>
        </div>
      </div>

      <div class="settings-item value" id="item-jarmods">
        <span class="settings-label" data-i18n="settings.jarmods">Jar mods</span>
        <span class="settings-value" id="current-jarmods">—</span>
      </div>

      <div class="settings-item value" id="item-gamefolder">
        <span class="settings-label" data-i18n="settings.gameFolder">Game folder</span>
        <span class="settings-value" id="current-gamefolder">—</span>
      </div>

      <div class="settings-item value" id="item-language">
        <span class="settings-label" data-i18n="settings.language">Language</span>
        <span class="settings-value" id="current-language">—</span>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal-box" id="modal-box"></div>
  </div>

  <script src="src/i18n.js"></script>
  <script src="src/settings.js"></script>
</body>
</html>
